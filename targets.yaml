# targets.yaml — Lane 1 target companies for the job-hunter pipeline
#
# Ordered by how directly Sumit's edge transfers:
#   ITSM/Freshservice support engineering + IAM/SSO + API/webhook troubleshooting.
#
# HOW LANE 1 USES THIS FILE
#   For each company the pipeline resolves `ats` + `board_id` and pulls LIVE reqs:
#     - greenhouse | lever | ashby | smartrecruiters | workable  -> clean JSON API, no scraping
#     - workday | taleo | successfactors | icims | custom        -> Firecrawl /crawl (no clean API / bot-walled)
#   Because a board only lists currently-open roles, everything Lane 1 returns is fresh by construction.
#
# ONE-TIME SETUP PER COMPANY (the only manual step)
#   Open the careers page, click "apply" on any role, and watch the URL:
#     boards.greenhouse.io/{token}      -> ats: greenhouse, board_id: {token}
#     jobs.lever.co/{slug}              -> ats: lever,      board_id: {slug}
#     jobs.ashbyhq.com/{slug}           -> ats: ashby,      board_id: {slug}
#     *.myworkdayjobs.com/...           -> ats: workday,    board_id: {tenant/site}  (Firecrawl lane)
#     anything bespoke / no clean board -> ats: custom,     careers_url set          (Firecrawl lane)
#
# status:  target | applied | in_play | contact   (in_play/applied/contact carry existing momentum)
# ats/board_id "TBD" = detect once, then it runs forever.

meta:
  owner: Sumit Mishra
  location_filter: ["Ireland", "Ireland-remote", "Dublin", "Galway", "Cork"]
