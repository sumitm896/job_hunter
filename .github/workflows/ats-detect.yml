name: ATS Detection (Lane 1)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ATS detection (writes cache back into targets.yaml)
        run: python ats_detect.py targets.yaml --write-back

      - name: Commit refreshed detection cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add targets.yaml
          git diff --staged --quiet || git commit -m "chore: refresh ATS detection cache [skip ci]"
          git push
